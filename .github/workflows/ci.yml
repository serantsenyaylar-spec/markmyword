name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Azure OCR safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-only authentication bypass. No production credential is used.
      APP_ENV: test
      ALLOW_DEV_BYPASS: "true"
      DEV_AUTH_BYPASS: "true"
      ALLOWED_DOMAIN: istek.k12.tr

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "import app"

      - name: Render every Streamlit tab
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=180)
          at.run()
          if at.exception:
              for error in at.exception:
                  print(error.value)
              raise SystemExit("Streamlit rendering raised an exception")
          if len(at.tabs) != 9:
              raise SystemExit(f"Expected 9 tabs, found {len(at.tabs)}")
          print("Streamlit app rendered cleanly")
          PY

      - name: Run offline Azure OCR tests
        run: python -m unittest discover -s tests -v

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check --select F,E9 .
