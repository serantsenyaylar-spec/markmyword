# CodeQL security analysis for Mark My Words (Python).
#
# CodeQL is a static vulnerability scanner. With `build-mode: none` it does not
# install dependencies or import the app, so it can catch structural issues
# (injections, unsafe deserialization, etc.) even when a dependency is missing.
# The separate `ci.yml` workflow is what proves the app actually boots with the
# pinned requirements; this workflow is purely for security analysis.
#
# Python is interpreted, so no build step is required.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for uploading SARIF results to the security tab.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # No build step is required for a pure-Python Streamlit app.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
